# Draws a snake eating the contribution graph, in light and dark versions,
# and publishes them to the `output` branch for the profile README.

name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: devam2001
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C15F3C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D97757
            dist/github-contribution-grid-snake.gif?color_snake=#C15F3C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
