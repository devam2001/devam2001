<svg xmlns="http://www.w3.org/2000/svg" width="470" height="36" viewBox="0 0 470 36" role="img" aria-label="Open to Software Engineering and DevOps roles in Melbourne">
  <style>
    .pill { fill: #f6f8fa; stroke: #d0d7de; }
    .t { font: 500 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #1f2328; }
    .dot { fill: #1a7f37; }
    .ring { fill: none; stroke: #1a7f37; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring { display: none; } }
  </style>
  <rect class="pill" x="1" y="1" width="468" height="34" rx="17"/>
  <circle class="ring" cx="22" cy="18" r="5"/>
  <circle class="dot" cx="22" cy="18" r="5"/>
  <text class="t" x="38" y="22.5">Open to Software Engineering &amp; DevOps roles · Melbourne</text>
</svg>
