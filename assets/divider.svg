<svg xmlns="http://www.w3.org/2000/svg" width="800" height="8" viewBox="0 0 800 8" aria-hidden="true">
  <defs>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#D97757" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D97757"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .base { stroke: #8b949e; stroke-opacity: .3; stroke-width: 1; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-240px); } to { transform: translateX(800px); } }
    @media (prefers-reduced-motion: reduce) { .sweep { display: none; } }
  </style>
  <line class="base" x1="0" y1="4" x2="800" y2="4"/>
  <rect class="sweep" x="0" y="3" width="240" height="2" rx="1" fill="url(#glow)"/>
</svg>
