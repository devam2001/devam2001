<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-label="Devamkumar Patel. QA Engineer and SDET, Master of IT student at Monash University, building ridgeline, based in Melbourne.">
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .name { font-size: 46px; font-weight: 700; letter-spacing: -0.5px; fill: #1f2328; animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both; }
    .line { stroke: #C15F3C; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .9s .5s ease-out forwards; }
    .role { font-size: 19px; font-weight: 500; fill: #59636e; opacity: 0; animation: cycle 16s infinite; }
    .accent { fill: #C15F3C; font-weight: 600; }
    .r1 { animation-delay: .8s; } .r2 { animation-delay: 4.8s; } .r3 { animation-delay: 8.8s; } .r4 { animation-delay: 12.8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      4%, 21% { opacity: 1; transform: none; }
      25%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .line { stroke-dashoffset: 0; }
      .r1 { opacity: 1; }
    }
  </style>
  <text class="name" x="400" y="72" text-anchor="middle">Devamkumar Patel</text>
  <line class="line" x1="340" y1="96" x2="460" y2="96"/>
  <g text-anchor="middle">
    <text class="role r1" x="400" y="140">QA Engineer · SDET · 2+ years of test automation</text>
    <text class="role r2" x="400" y="140">Master of IT, AI &amp; Quantum Computing · Monash University</text>
    <text class="role r3" x="400" y="140">Building <tspan class="accent">ridgeline</tspan>, a trading bot that has to pass its own tests</text>
    <text class="role r4" x="400" y="140">Based in Melbourne · open to Software Engineering &amp; DevOps roles</text>
  </g>
</svg>
